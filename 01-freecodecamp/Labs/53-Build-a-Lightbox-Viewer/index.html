<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1 class="headline">Museum Gallery</h1>
    <div class="gallery">
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
        alt="Stonehenge painting"
        class="gallery-item"
      />
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
        alt="Snowstorm at Mont Cenis painting"
        class="gallery-item"
      />
      <img
        src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
        alt="Driving home the flock painting"
        class="gallery-item"
      />
    </div>
    <div class="lightbox">
      <button id="close-btn">&times;</button>
      <img src="" alt="" id="lightbox-image" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
